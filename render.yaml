services:
  - type: web
    name: quote-clash
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: LLM_PROVIDER
        value: gemini
      - key: MODEL_NAME
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
